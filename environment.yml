# Legacy single-environment file.
# On Apple Silicon, prefer split envs in:
#   - environment.map-x64.yml
#   - environment.r-x64.yml
name: benchwgbsanimal
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  - r-base=4.3
  - r-data.table
  - r-ggplot2
  - r-pheatmap
  - r-ggpubr
  - r-rcolorbrewer
  - r-stringr
  - r-venndiagram
  - bioconductor-dss
  - bioconductor-bsseq
  - bioconductor-biomart
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
  - bioconductor-org.bt.eg.db
  - bioconductor-org.ss.eg.db
  - bsbolt
